name: Deploy CMS to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup SSH agent with private key (multi-line safe)
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Step 3: Add server to known_hosts
      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Step 4: Deploy via SSH
      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_USER }}"@"${{ secrets.SERVER_HOST }}" << 'EOF'
            set -e

            # Go to project directory
            cd "${{ secrets.PROJECT_PATH }}"

            echo "📦 Pulling latest code"
            git reset --hard
            git clean -fd
            git pull origin main

            echo "🐳 Building & starting containers"
            docker compose down
            docker compose build --no-cache
            docker compose up -d

            echo "🧹 Cleaning unused images"
            docker image prune -f
          EOF

