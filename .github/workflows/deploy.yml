name: Deploy CMS to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug Secrets (without showing values)
        run: |
          echo "Checking if secrets exist..."
          echo "SSH_PRIVATE_KEY length: ${#SSH_PRIVATE_KEY}"
          echo "SERVER_HOST: $SERVER_HOST"
          echo "SERVER_PORT: $SERVER_PORT"
          echo "SERVER_USER: $SERVER_USER"
          echo "PROJECT_PATH: $PROJECT_PATH"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}

      - name: Setup SSH properly
        run: |
          # Create .ssh directory
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Write private key carefully
          cat > ~/.ssh/id_ed25519 << 'EOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          
          chmod 600 ~/.ssh/id_ed25519
          
          # Add to known hosts
          ssh-keyscan -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          
          # Test SSH connection
          echo "Testing SSH connection..."
          ssh -o BatchMode=yes -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo 'SSH connection successful'"

      - name: Deploy via SSH
        run: |
          ssh -o BatchMode=yes -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.PROJECT_PATH }}

            echo "📦 Pulling latest code"
            git reset --hard
            git clean -fd
            git pull origin main

            echo "🐳 Building & starting containers"
            docker compose down
            docker compose build
            docker compose up -d

            echo "🧹 Cleaning unused images"
            docker image prune -f
          EOF
