services:
  postgres:
    image: postgres:16
    container_name: cms_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-cms_db}
      POSTGRES_USER: ${DB_USER:-cms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cms@mom.gov.et}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cms_network

  backend:
    build: ./backend
    container_name: cms_backend
    restart: always
    env_file:
      - ./backend/.env.example
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - SOCKET_PORT=5000
    depends_on:
      - postgres
    networks:
      - cms_network
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cms_frontend
    restart: always
    env_file:
      - ./frontend/.env.example
    environment:
      - NODE_ENV=production
      - AUTH_TRUSTED_HOST=true
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
      - BACKEND_INTERNAL_URL=http://backend:4000
    depends_on:
      - backend
    networks: 
      - cms_network

  nginx:
    image: nginx:alpine
    container_name: cms_nginx
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cms_network

volumes:
  postgres_data:

networks:
  cms_network:
    driver: bridge
