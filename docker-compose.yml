services:
  postgres:
    image: postgres:16
    container_name: cms_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-cms_db}
      POSTGRES_USER: ${DB_USER:-cms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cms@mom.gov.et}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cms_network

  backend:
    build: ./backend
    container_name: cms_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      PORT: 4002
      DB_HOST: postgres
      DB_PORT: 5432
      SOCKET_PORT: 5002
    depends_on:
      - postgres
    networks:
      - cms_network
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SYSTEM_TIMEZONE: ${NEXT_PUBLIC_SYSTEM_TIMEZONE:-Africa/Addis_Ababa}
    container_name: cms_frontend
    restart: always
    env_file:
      - ./frontend/.env
    environment:
      PORT: 3002
      NODE_ENV: production
      AUTH_TRUSTED_HOST: "true"
      NEXTAUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://${DOMAIN:-10.0.71.199:3002}}
      BACKEND_INTERNAL_URL: http://backend:4002
    depends_on:
      - backend
    networks:
      - cms_network

  nginx:
    build: ./nginx
    container_name: cms_nginx
    restart: always
    environment:
      DOMAIN: ${DOMAIN:-10.0.71.199:3002}
    ports:
      - "8083:80"
    volumes:
      - ./nginx/nginx.conf.bootstrap:/etc/nginx/templates/nginx.conf.bootstrap:ro
      - ./nginx/nginx.conf.production:/etc/nginx/templates/nginx.conf.production:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    networks:
      - cms_network

  certbot:
    image: certbot/certbot
    container_name: cms_certbot
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-10.0.71.199:3002}
      EMAIL: ${EMAIL:-admin@complaint.mom.gov.et}
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./certbot/certbot-entrypoint.sh:/certbot-entrypoint.sh:ro
    entrypoint: /bin/sh /certbot-entrypoint.sh
    networks:
      - cms_network
    depends_on:
      - nginx
volumes:
  postgres_data:

networks:
  cms_network:
    driver: bridge
