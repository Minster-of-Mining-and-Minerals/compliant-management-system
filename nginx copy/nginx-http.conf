# Temporary HTTP-only config used during initial SSL certificate issuance
server {
    listen 80;
    server_name www.mom.gov.et;

    # Certbot ACME challenge — must stay accessible
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Respond to all other requests while cert is being issued
    location / {
        return 200 'SSL certificate is being set up. Please wait...';
        add_header Content-Type text/plain;
    }
}
