server {
    listen 8080;
    server_name 10.0.71.61;

    # ─── NextAuth internal endpoints (handled by Next.js frontend) ───────────
    # These are strictly the NextAuth.js session management routes.
    # Must be defined BEFORE the general /api/auth block so they take priority.
    location ~ ^/api/auth/(session|csrf|providers|callback|signout|signin|_log) {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ─── All other /api/* routes go to the backend ───────────────────────────
    # This covers:
    #   /api/auth/login, /api/auth/logout, /api/auth/me/permissions
    #   /api/auth/forgot-password, /api/auth/request-otp, /api/auth/verify-otp
    #   /api/change-password, /api/users, /api/roles, etc.
    location /api {
        proxy_pass http://backend:4000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # ─── Static uploads served by backend ────────────────────────────────────
    location /uploads {
        proxy_pass http://backend:4000/uploads;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # ─── Everything else goes to the Next.js frontend ────────────────────────
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # Next.js HMR / WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Max upload size
    client_max_body_size 100M;
}
